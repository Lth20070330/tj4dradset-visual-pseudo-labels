[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-pseudo-labels"
version = "0.1.0"
description = "Visual pseudo-label pipeline for TJ4DRadSet radar perception"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python>=4.10",
  "pillow>=10",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
vision = ["torch>=2.11", "torchvision>=0.26", "ultralytics>=8.4"]

[tool.setuptools.packages.find]
where = ["src"]
